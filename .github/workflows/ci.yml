name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify codec manifest
        run: uv run pytest tests/test_runtime.py tests/test_codec_smoke.py -q

      - name: Lint
        run: |
          uv run --with ruff ruff check src --select I,F
          uv run --with ruff ruff check tests main.py build.py --select F

      - name: Run tests
        run: uv run pytest -q
